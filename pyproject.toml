[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sam31-trt"
version = "0.1.0"
description = "Reproducible SAM 3.1 TensorRT optimization experiments"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26,<2",
  "opencv-python-headless",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

